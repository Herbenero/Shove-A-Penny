<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dart Tracker - Board Selector</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111827;
      color: #e5e7eb;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 16px;
      max-width: 380px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
    h2 {
      margin-top: 0;
      color: #ff9f1c;
    }
    .board-select-container {
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #4b5563;
      background: #111827;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    .score-display {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #1d4ed8;
    }
    button.secondary {
      background: #4b5563;
    }
    button.secondary:hover {
      background: #374151;
    }
    button.active {
      background: #dc2626 !important;
    }
    .hidden {
      display: none !important;
    }

    /* Grid Layouts */
    .multiplier-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .multiplier-row.has-quad {
      grid-template-columns: repeat(4, 1fr);
    }
    .dartboard-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .bull-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .log-area {
      margin-top: 12px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Dartboard Input</h2>

    <!-- Board Type Selector -->
    <div class="board-select-container">
      <label for="boardType">Board Type:</label>
      <select id="boardType">
        <option value="basic">Basic Board</option>
        <option value="quad">Quad Board</option>
      </select>
    </div>

    <!-- Total Score Display -->
    <div class="score-display">Score: <span id="totalScore">0</span></div>

    <!-- Multipliers & Miss -->
    <div class="multiplier-row" id="multiplierRow">
      <button id="missBtn" class="secondary">Miss</button>
      <button class="mult-btn" data-m="2">Double (2x)</button>
      <button class="mult-btn" data-m="3">Triple (3x)</button>
      <button id="quadBtn" class="mult-btn hidden" data-m="4">Quad (4x)</button>
    </div>

    <!-- Numbers 1 through 20 -->
    <div class="dartboard-grid">
      <button class="num-btn" data-value="1">1</button>
      <button class="num-btn" data-value="2">2</button>
      <button class="num-btn" data-value="3">3</button>
      <button class="num-btn" data-value="4">4</button>
      <button class="num-btn" data-value="5">5</button>
      <button class="num-btn" data-value="6">6</button>
      <button class="num-btn" data-value="7">7</button>
      <button class="num-btn" data-value="8">8</button>
      <button class="num-btn" data-value="9">9</button>
      <button class="num-btn" data-value="10">10</button>
      <button class="num-btn" data-value="11">11</button>
      <button class="num-btn" data-value="12">12</button>
      <button class="num-btn" data-value="13">13</button>
      <button class="num-btn" data-value="14">14</button>
      <button class="num-btn" data-value="15">15</button>
      <button class="num-btn" data-value="16">16</button>
      <button class="num-btn" data-value="17">17</button>
      <button class="num-btn" data-value="18">18</button>
      <button class="num-btn" data-value="19">19</button>
      <button class="num-btn" data-value="20">20</button>
    </div>

    <!-- Bullseye options -->
    <div class="bull-row">
      <button class="bull-btn" data-bull="25">Bull (25)</button>
      <button class="bull-btn" data-bull="50">Double Bull (50)</button>
    </div>

    <div class="log-area" id="lastThrowLog">Last Throw: -</div>
  </div>

  <script>
    let activeMultiplier = 1;
    let currentScore = 0;

    const boardTypeSelect = document.getElementById('boardType');
    const multiplierRow = document.getElementById('multiplierRow');
    const quadBtn = document.getElementById('quadBtn');
    const multBtns = document.querySelectorAll('.mult-btn');
    const numBtns = document.querySelectorAll('.num-btn');
    const bullBtns = document.querySelectorAll('.bull-btn');
    const missBtn = document.getElementById('missBtn');
    const totalScoreDisplay = document.getElementById('totalScore');
    const lastThrowLog = document.getElementById('lastThrowLog');

    // Handle Board Type Dropdown Change
    boardTypeSelect.addEventListener('change', (e) => {
      const mode = e.target.value;
      
      // Reset active multiplier when changing boards
      clearMultiplier();

      if (mode === 'quad') {
        quadBtn.classList.remove('hidden');
        multiplierRow.classList.add('has-quad');
      } else {
        quadBtn.classList.add('hidden');
        multiplierRow.classList.remove('has-quad');
      }
    });

    // Multiplier Button Toggling
    multBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const multVal = parseInt(btn.getAttribute('data-m'), 10);

        if (activeMultiplier === multVal) {
          clearMultiplier();
        } else {
          multBtns.forEach(b => b.classList.remove('active'));
          activeMultiplier = multVal;
          btn.classList.add('active');
        }
      });
    });

    function clearMultiplier() {
      activeMultiplier = 1;
      multBtns.forEach(b => b.classList.remove('active'));
    }

    // Score Logging & Multiplier Reset Logic
    function recordScore(baseValue, label) {
      const points = baseValue * activeMultiplier;
      currentScore += points;
      totalScoreDisplay.textContent = currentScore;

      let multPrefix = '';
      if (activeMultiplier === 2) multPrefix = 'Double ';
      if (activeMultiplier === 3) multPrefix = 'Triple ';
      if (activeMultiplier === 4) multPrefix = 'Quad ';

      lastThrowLog.textContent = `Last Throw: ${multPrefix}${label} (+${points} pts)`;

      clearMultiplier();
    }

    // Button Event Handlers
    numBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.getAttribute('data-value'), 10);
        recordScore(val, val.toString());
      });
    });

    bullBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.getAttribute('data-bull'), 10);
        const label = val === 25 ? 'Bull' : 'Double Bull';
        recordScore(val, label);
      });
    });

    missBtn.addEventListener('click', () => {
      recordScore(0, 'Miss');
    });
  </script>

</body>
</html>
